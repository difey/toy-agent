[project]
name = "mira-code"
version = "0.1.0"
description = "Mira Code — Coding Agent 平台（P0 骨架：契约 / 配置 / Provider / 遥测）"
readme = "docs/README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "rich>=13.0",
  "textual>=0.60",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12.0",
  "tomli-w>=1.0",
  "litellm>=1.96.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
mira = "mira.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mira"]

[tool.pytest.ini_options]
testpaths = ["tests"]
