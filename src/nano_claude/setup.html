<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nanoClaude — 配置向导</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2;
    --text: #24292f; --text-dim: #656d76; --text-bright: #1f2328;
    --accent: #0969da; --accent2: #1a7f37; --accent3: #8250df;
    --border: #d0d7de; --danger: #cf222e;
    --input-bg: #ffffff; --radius: 10px; --radius-sm: 6px;
    --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono: "SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  #app { width: 100%; max-width: 560px; }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 40px; box-shadow: 0 16px 48px rgba(0,0,0,0.4); }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo .icon { font-size: 48px; }
  .logo h1 { font-size: 28px; font-weight: 700; color: var(--text-bright); margin-top: 8px; }
  .logo h1 span { color: var(--accent); }
  .logo p { color: var(--text-dim); font-size: 14px; margin-top: 4px; }

  .step-indicator { display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
  .step-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border);
    transition: all 0.3s; }
  .step-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .step-dot.done { background: var(--accent2); }

  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group .hint { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .form-group .error-text { font-size: 12px; color: var(--danger); margin-top: 4px; }

  select, input { width: 100%; padding: 10px 14px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text);
    font-size: 15px; font-family: var(--font); outline: none; transition: border-color 0.15s; }
  select:focus, input:focus { border-color: var(--accent); }
  select option { background: var(--bg2); color: var(--text); }
  input::placeholder { color: var(--text-dim); }
  input[type="password"] { font-family: var(--mono); }

  .env-note { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 16px; margin-bottom: 20px; font-size: 13px; color: var(--accent2); line-height: 1.6; }
  .env-note strong { color: var(--text-bright); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px 24px; border: none; border-radius: var(--radius-sm);
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    color: #fff; background: var(--accent); }
  .btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .skip-link { display: block; text-align: center; margin-top: 16px; font-size: 13px; }
  .skip-link a { color: var(--text-dim); text-decoration: none; cursor: pointer; }
  .skip-link a:hover { color: var(--accent); }

  .success-screen { text-align: center; }
  .success-screen .check { font-size: 64px; margin-bottom: 16px; }
  .success-screen h2 { font-size: 24px; color: var(--accent2); margin-bottom: 8px; }
  .success-screen p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
  .success-screen .summary { background: var(--bg3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 24px; text-align: left; }
  .success-screen .summary .row { display: flex; justify-content: space-between; padding: 6px 0; }
  .success-screen .summary .row .label { color: var(--text-dim); }
  .success-screen .summary .row .value { color: var(--text-bright); font-weight: 600; }

  .provider-badge { display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    background: rgba(88,166,255,0.15); color: var(--accent); margin-left: 6px; }

  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="card">
    <!-- Step 1: Welcome & Provider/Model selection -->
    <template v-if="step === 1">
      <div class="logo">
        <div class="icon">🤖</div>
        <h1>nano<span>Claude</span></h1>
        <p>coding assistant — 配置向导</p>
      </div>
      <div class="step-indicator">
        <span class="step-dot active"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
      </div>

      <div v-if="hasEnvVars" class="env-note">
        ✅ 检测到环境变量已配置，你可直接 <strong>跳过</strong> 配置，或按需修改。
      </div>

      <div class="form-group">
        <label>选择模型</label>
        <select v-model="selectedModel">
          <option v-for="m in presets" :key="m.model" :value="m.model">
            {{ m.label }}
          </option>
          <option value="__custom__">自定义模型...</option>
        </select>
        <div class="hint">Provider 根据模型名称自动识别：deepseek → DeepSeek, gpt- → OpenAI, claude → Anthropic</div>
      </div>

      <div class="form-group" v-if="selectedModel === '__custom__'">
        <label>自定义模型名称</label>
        <input v-model="customModel" placeholder="例如: gpt-4.1-mini 或 claude-sonnet-4-20250514" @input="validateCustom">
        <div class="error-text" v-if="customModel && !customValid">模型名称不能为空</div>
        <div class="hint" v-if="customModel && customProvider">
          检测到 Provider: <span class="provider-badge">{{ customProvider }}</span>
        </div>
      </div>

      <div class="form-group" v-if="!hasEnvVars">
        <label>API Key</label>
        <input type="password" v-model="apiKey" placeholder="输入 API key..." autocomplete="off">
        <div class="hint">支持的环境变量：NANO_CLAUDE_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, ANTHROPIC_API_KEY</div>
      </div>

      <button class="btn" @click="nextStep" :disabled="!canProceed || saving">
        <span v-if="saving" class="spinner"></span>
        <span v-else>继续</span>
      </button>

      <div class="skip-link" v-if="hasEnvVars">
        <a @click="skipToApp">⚡ 跳过配置，直接使用</a>
      </div>
    </template>

    <!-- Step 2: Confirm & Save -->
    <template v-if="step === 2">
      <div class="logo">
        <div class="icon">📋</div>
        <h1>确认配置</h1>
      </div>
      <div class="step-indicator">
        <span class="step-dot done"></span>
        <span class="step-dot active"></span>
        <span class="step-dot"></span>
      </div>

      <div class="summary">
        <div class="row"><span class="label">模型</span><span class="value">{{ displayModel }}</span></div>
        <div class="row"><span class="label">Provider</span><span class="value">{{ providerName }}</span></div>
        <div class="row" v-if="apiKey"><span class="label">API Key</span><span class="value">{{ maskedKey }}</span></div>
      </div>

      <button class="btn" @click="saveConfig" :disabled="saving">
        <span v-if="saving" class="spinner"></span>
        <span v-else>💾 保存并继续</span>
      </button>

      <div class="skip-link">
        <a @click="step = 1">← 返回修改</a>
      </div>
    </template>

    <!-- Step 3: Success! -->
    <template v-if="step === 3">
      <div class="success-screen">
        <div class="check">🎉</div>
        <h2>配置完成！</h2>
        <p>nanoClaude 已准备就绪，即将进入主界面。</p>
        <div class="summary">
          <div class="row"><span class="label">模型</span><span class="value">{{ displayModel }}</span></div>
          <div class="row"><span class="label">状态</span><span class="value" style="color:var(--accent2)">✅ 已保存</span></div>
        </div>
        <button class="btn" @click="goToApp">🚀 开始使用</button>
      </div>
    </template>

    <!-- Error toast -->
    <div v-if="error" style="margin-top:16px;padding:10px 14px;background:rgba(248,81,73,0.1);border:1px solid var(--danger);border-radius:var(--radius-sm);color:var(--danger);font-size:13px;">
      ⚠️ {{ error }}
    </div>
  </div>
</div>

<script>
const { createApp, ref, computed, onMounted } = Vue;

const PRESET_MODELS = [
  { model: 'deepseek-v4-pro', label: 'DeepSeek V4 Pro', provider: 'deepseek' },
  { model: 'deepseek-v4-flash', label: 'DeepSeek V4 Flash (fast, cheap)', provider: 'deepseek' },
  { model: 'gpt-4o', label: 'OpenAI GPT-4o', provider: 'openai' },
  { model: 'gpt-4.1-mini', label: 'OpenAI GPT-4.1 Mini (fast, cheap)', provider: 'openai' },
  { model: 'claude-sonnet-4-20250514', label: 'Anthropic Claude Sonnet 4', provider: 'anthropic' },
];

function detectProvider(model) {
  const m = (model || '').toLowerCase();
  if (m.startsWith('gpt-') || m.startsWith('o1-') || m.startsWith('o3-') || m.startsWith('o4-')) return 'openai';
  if (m.startsWith('deepseek')) return 'deepseek';
  if (m.startsWith('claude')) return 'anthropic';
  return 'openai';
}

function providerLabel(provider) {
  const map = { openai: 'OpenAI', deepseek: 'DeepSeek', anthropic: 'Anthropic', ollama: 'Ollama' };
  return map[provider] || provider;
}

createApp({
  setup() {
    const step = ref(1);
    const selectedModel = ref(PRESET_MODELS[0].model);
    const customModel = ref('');
    const apiKey = ref('');
    const saving = ref(false);
    const error = ref('');
    const hasEnvVars = ref(false);

    const presets = PRESET_MODELS;

    const displayModel = computed(() => {
      return selectedModel.value === '__custom__' ? customModel.value : selectedModel.value;
    });

    const customProvider = computed(() => {
      if (!customModel.value) return '';
      return providerLabel(detectProvider(customModel.value));
    });

    const customValid = computed(() => customModel.value.trim().length > 0);

    const providerName = computed(() => {
      const m = selectedModel.value === '__custom__' ? customModel.value : selectedModel.value;
      return providerLabel(detectProvider(m));
    });

    const canProceed = computed(() => {
      if (selectedModel.value === '__custom__' && !customValid.value) return false;
      if (!hasEnvVars.value && !apiKey.value.trim()) return false;
      return true;
    });

    const maskedKey = computed(() => {
      const k = apiKey.value;
      if (!k) return '(使用环境变量)';
      if (k.length <= 8) return '*'.repeat(k.length);
      return k.slice(0, 4) + '*'.repeat(k.length - 8) + k.slice(-4);
    });

    async function checkStatus() {
      try {
        const r = await fetch('/api/setup-status');
        const d = await r.json();
        if (d.configured) {
          // Already configured — go straight to app
          window.location.href = '/';
          return;
        }
        if (d.has_env_vars) {
          hasEnvVars.value = true;
        }
        // Pre-fill model from existing config
        if (d.model) {
          const found = PRESET_MODELS.find(p => p.model === d.model);
          if (found) {
            selectedModel.value = d.model;
          } else {
            selectedModel.value = '__custom__';
            customModel.value = d.model;
          }
        }
      } catch (e) {
        // Server might not be ready yet, ignore
      }
    }

    function nextStep() {
      error.value = '';
      step.value = 2;
    }

    async function saveConfig() {
      saving.value = true;
      error.value = '';
      try {
        const model = selectedModel.value === '__custom__' ? customModel.value.trim() : selectedModel.value;
        const r = await fetch('/api/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model, api_key: apiKey.value || undefined }),
        });
        if (!r.ok) {
          const e = await r.json();
          throw new Error(e.detail || '保存失败');
        }
        step.value = 3;
      } catch (e) {
        error.value = e.message || '保存配置失败，请重试';
      } finally {
        saving.value = false;
      }
    }

    function skipToApp() {
      // User has env vars but no config file — still try to save a minimal config
      window.location.href = '/';
    }

    function goToApp() {
      window.location.href = '/';
    }

    function validateCustom() {
      // No-op, reactivity handles it
    }

    onMounted(() => {
      checkStatus();
    });

    return {
      step, selectedModel, customModel, apiKey, saving, error, hasEnvVars,
      presets, displayModel, customProvider, customValid, providerName, canProceed, maskedKey,
      nextStep, saveConfig, skipToApp, goToApp, validateCustom,
    };
  }
}).mount('#app');
</script>
</body>
</html>
