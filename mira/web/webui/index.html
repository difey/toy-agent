<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mira Code</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<!-- Markdown 渲染（markdown-it + DOMPurify + highlight.js + KaTeX） -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
<script>
  (function () {
    fetch('/static/app.js')
      .then(function (r) { if (!r.ok) throw new Error('app.js HTTP ' + r.status); return r.text(); })
      .then(function (code) {
        var out = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] });
        var el = document.createElement('script');
        el.text = out.code;
        document.body.appendChild(el);
      })
      .catch(function (e) { document.getElementById('root').textContent = '前端加载失败: ' + e.message; });
  })();
</script>
</body>
</html>
